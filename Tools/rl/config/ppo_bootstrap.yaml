behaviors:
  ElephantCrisis:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    checkpoint_interval: 100000
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
    threaded: false

env_settings:
  env_path: null
  env_args: null
  num_envs: 1
  seed: 42

engine_settings:
  time_scale: 20
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

environment_parameters: {}

# Bootstrap：Unity 侧 -rlCurriculum bootstrap（1 RL vs 3 Heuristic）
# 启动示例见 Tools/rl/README.md
