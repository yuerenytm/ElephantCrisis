behaviors:
  ElephantCrisis:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 5000
    max_steps: 50000
    time_horizon: 128
    summary_freq: 1000
    threaded: false

env_settings:
  env_path: null
  env_args: null
  num_envs: 1
  seed: 42
  # Unity Editor 冷启动可能超过 1 分钟，握手超时放大到 600s
  timeout_wait: 600

engine_settings:
  time_scale: 20
  quality_level: 0
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

environment_parameters: {}

# 冒烟测试配置：仅验证 链路握手 / SPS / checkpoint 产出，非正式训练。
# 用法：
#   终端A: .\.venv\Scripts\python -m mlagents.trainers.learn config/ppo_smoke.yaml --run-id ec_smoke_v1 --results-dir results --force
#   终端B: python scripts/run_train_env.py --curriculum bootstrap --role human
