behaviors:
  ElephantCrisis:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512          # 2^9
      buffer_size: 8192        # 2^13；攒满再学一次
      learning_rate: 2.5e-4
      beta: 2.5e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4             # 2^2
      learning_rate_schedule: linear
      beta_schedule: constant
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512       # 2^9
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 16       # 2^4；磁盘上最多留几个模型文件
    checkpoint_interval: 16384 # 2^14；每这么多步「存盘」一次（整次训练约 16 份）
    max_steps: 262144          # 2^18
    time_horizon: 256          # 2^8
    summary_freq: 8192         # 2^13；TensorBoard 摘要频率
    threaded: false
    # 人口自博弈：与幽灵对手交替（团队对抗语义；FFA 共享策略仍用同 BehaviorName）
    self_play:
      save_steps: 16384        # 2^14；每隔这么多步把当前策略放进对手池
      team_change: 65536       # 2^16
      swap_steps: 8192         # 2^13；换对手策略的频率
      window: 8                # 2^3；对手池只留最近 8 个快照
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

env_settings:
  env_path: null
  num_envs: 1
  seed: 7

engine_settings:
  time_scale: 20
  quality_level: 0
  no_graphics: true

# Unity：-rlCurriculum selfplay -rlLeagueDir <checkpoints>
