# 客户端性能分析阈值（与 Game/Assets/StreamingAssets/Config/client_perf.yaml 保持同结构）

hitch_ms: 33.3
frame_sample_every: 0          # 0=只记录 hitch；>0 则每 N 帧记一条 frame
memory_interval_sec: 2.0
recent_load_window_ms: 100.0   # hitch 归因：此前多少 ms 内的 resource_load
max_recent_loads: 8
recent_action_window_ms: 500.0 # hitch 归因：此前多少 ms 内的 game_action
max_recent_actions: 16

auto:
  enabled_by_default: false
  human_role: Human            # Elephant / Human / Monkey / Cat
  max_seconds: 120
  max_full_rounds: 40

analyze:
  top_k_loads: 20
  top_k_hitches: 30
  top_k_causes: 15
  cooccur_pad_ms: 250.0
  isolation_forest:
    enabled: true
    contamination: 0.08
    n_estimators: 200
    random_state: 42
    min_seconds: 8
