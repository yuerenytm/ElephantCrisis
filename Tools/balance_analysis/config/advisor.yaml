# 数值平衡顾问配置
# api_key 只从环境变量读取（BALANCE_ADVISOR_API_KEY 或 OPENAI_API_KEY），
# 不要把它写回这个文件——本仓库是公开的。

api:
  api_key: ""
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash
  temperature: 0.3
  timeout_sec: 120

preprocess:
  include_game_rules: true
  include_overview_doc: true
  overview_doc_max_chars: 8000
  include_role_doc: true
  role_doc_max_chars: 6000
  # 只保留报告中的这些顶层字段，进一步压缩
  report_keys:
    - summary
    - by_role
    - strategy_usage

advice:
  win_rate_low: 0.12
  win_rate_high: 0.38
  prefer_yaml_fields: true   # 建议尽量落到 game_rules.yaml 可改字段
